[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-society-sandbox"
version = "0.1.0"
description = "Deterministic Agent-Based Simulation platform for a virtual society"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
digital-society-sandbox = "dss.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
